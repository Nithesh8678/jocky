services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    restart: unless-stopped
  api:
    restart: unless-stopped
  dashboard:
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      JOCKY_DOMAIN: ${JOCKY_DOMAIN:?Set your real domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, dashboard]
volumes:
  caddy_data:
  caddy_config:
