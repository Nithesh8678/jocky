name: jocky
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jocky
      POSTGRES_DB: jocky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/configure.py}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U jocky"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    command: [redis-server, --appendonly, "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["minio_data:/data"]
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://jocky:${POSTGRES_PASSWORD}@postgres:5432/jocky
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      JOCKY_CLI: /usr/local/bin/jocky
    ports: ["127.0.0.1:58000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/dashboard.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3100:3100"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  minio_data:
